name: security

# Dependency vulnerability scanning — complements CodeQL (which analyzes this
# repo's own code, not the known-CVE status of its dependencies).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly

permissions:
  contents: read

jobs:
  python-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [collector, api]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Upgrade pip/setuptools first — GitHub's setup-python images have shipped
      # setuptools versions with known CVEs (unrelated to our own dependencies;
      # this was caught by pip-audit itself flagging the runner's own toolchain).
      - run: pip install --upgrade pip setuptools
      - run: pip install -e "./${{ matrix.package }}[dev]"
      - run: pip install pip-audit
      - run: pip-audit

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: web
