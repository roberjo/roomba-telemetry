[project]
name = "roomba-collector"
version = "0.1.0"
description = "Connects to a Roomba's local MQTT API, normalizes state, and persists it."
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collector"]

[tool.pytest.ini_options]
# Makes the package importable directly from source regardless of editable-
# install quirks (observed: a legacy pip editable .pth can silently fail to
# take effect depending on install ordering vs. setuptools' own
# distutils-precedence.pth) — this is what actually makes `pytest
# collector/tests` reliable when run from the repo root, as CI does.
pythonpath = ["."]
