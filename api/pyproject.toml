[project]
name = "roomba-api"
version = "0.1.0"
description = "FastAPI service exposing Roomba state/mission/error history from SQLite, and mission-control commands over MQTT."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "paho-mqtt>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.pytest.ini_options]
# See collector/pyproject.toml's identical setting for why — makes the package
# importable directly from source regardless of editable-install ordering
# quirks, which is what makes `pytest api/tests` reliable from the repo root.
pythonpath = ["."]
