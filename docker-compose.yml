version: "3.9"

services:
  collector:
    build: ./collector
    env_file: .env
    volumes:
      - roomba-data:/data
    restart: unless-stopped

  api:
    build: ./api
    env_file: .env
    environment:
      ROOMBA_DB_PATH: /data/roomba.db
    volumes:
      - roomba-data:/data
    ports:
      - "8000:8000"
    depends_on:
      - collector
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  roomba-data:
